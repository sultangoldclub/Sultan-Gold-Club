<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sultan Club Gold</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #07110d;
      color: white;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .photo {
      width: 150px;
      height: 150px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #78d69a;
      box-shadow: 0 0 30px rgba(80, 220, 130, 0.25);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      margin-bottom: 28px;
      border-radius: 30px;
      background: #10251a;
      border: 1px solid #315d42;
      color: #9ae6b4;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .button {
      display: block;
      padding: 17px 20px;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      background: #10251a;
      border: 1px solid #315d42;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      background: #183a27;
      transform: translateY(-2px);
    }

    .telegram {
      background: #1689b8;
      border-color: #1689b8;
    }

    .youtube {
      background: #b91c1c;
      border-color: #b91c1c;
    }

    .instagram {
      background: #7c285d;
      border-color: #7c285d;
    }

    .footer {
      margin-top: 28px;
      color: #6f8b79;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="photo">
      <img src="photo_2026-09-24_22-23-51.jpg" alt="Sultan Club Gold">
    </div>

    <h1>Sultan Club Gold</h1>

    <div class="badge">
      TRADER / GOLD CLUB
    </div>

    <div class="buttons">

      <a class="button telegram"
         href="https://t.me/sultanmyrFX"
         target="_blank">
        Telegram
      </a>

      <a class="button youtube"
         href="https://youtube.com/@goldclubtrading?si=RFuHI7ED8cKqHDRh"
         target="_blank">
        YouTube
      </a>

      <a class="button instagram"
         href="https://www.instagram.com/so_tnikov?stkn=bW8xZTZ6dzl6YnU0&utm_source=qr"
         target="_blank">
        Instagram
      </a>

    </div>

    <div class="footer">
      © Sultan Club Gold
    </div>

  </div>

</body>
</html>
