<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sultan Club Gold</title>

<style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #050505;

      color: #fff;

      font-family: Arial, sans-serif;

      display: flex;

      justify-content: center;

      padding: 30px 15px;

    }

    .container {

      width: 100%;

      max-width: 500px;

      text-align: center;

    }

    .avatar {

      width: 110px;

      height: 110px;

      border-radius: 50%;

      object-fit: cover;

      border: 3px solid #d4af37;

      margin-bottom: 15px;

    }

    h1 {

      margin: 0;

      font-size: 30px;

      color: #d4af37;

    }

    .subtitle {

      margin-top: 8px;

      color: #aaa;

      font-size: 14px;

    }

    .badge {

      display: inline-block;

      margin-top: 12px;

      padding: 6px 14px;

      border: 1px solid #d4af37;

      border-radius: 20px;

      color: #d4af37;

      font-size: 12px;

    }

    .buttons {

      margin-top: 30px;

      display: flex;

      flex-direction: column;

      gap: 14px;

    }

    .button {

      width: 100%;

      min-height: 78px;

      padding: 14px 18px;

      border: 1px solid #252525;

      border-radius: 16px;

      background: #0d0d0d;

      color: #fff;

      text-decoration: none;

      display: flex;

      align-items: center;

      text-align: left;

      transition: 0.2s ease;

    }

    .button:hover {

      border-color: #d4af37;

      transform: translateY(-2px);

    }

    .icon-box {

      width: 48px;

      height: 48px;

      min-width: 48px;

      border-radius: 12px;

      background: #171717;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-right: 14px;

    }

    .icon-box svg {

      width: 26px;

      height: 26px;

      fill: #d4af37;

    }

    .button-text {

      flex: 1;

      min-width: 0;

    }

    .button-title {

      font-size: 16px;

      font-weight: 700;

      margin-bottom: 5px;

    }

    .button-description {

      color: #999;

      font-size: 12px;

      line-height: 1.35;

    }

    .arrow {

      color: #d4af37;

      font-size: 22px;

      margin-left: 10px;

    }

    footer {

      margin-top: 35px;

      color: #555;

      font-size: 11px;

    }

    @media (max-width: 600px) {

      body {

        padding: 25px 12px;

      }

      .container {

        max-width: 100%;

      }

      h1 {

        font-size: 27px;

      }

      .button {

        min-height: 74px;

      }

    }

    @media (max-width: 380px) {

      .avatar {

        width: 95px;

        height: 95px;

      }

      h1 {

        font-size: 24px;

      }

      .button-title {

        font-size: 15px;

      }

      .button-description {

        font-size: 11px;

      }

    }

  </style>

</head>

<img
